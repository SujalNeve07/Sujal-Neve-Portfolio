# Server Configuration
server.port=${PORT:8080}
spring.application.name=portfolio-backend

# Spring Mail (JavaMailSender) Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Portfolio Application Configuration
portfolio.mail.to=${MAIL_TO:sujal.neve07@gmail.com}
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173,https://sujal-neve-portfolio.vercel.app}
portfolio.ratelimit.max-requests=${RATE_LIMIT_MAX:5}
portfolio.ratelimit.window-seconds=${RATE_LIMIT_WINDOW:300}

# Logging (Strict privacy - never log passwords or raw contact content)
logging.level.com.sujalneve.portfolio=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.mail=WARN
